<script>
const ITEMS = [{"id":"h3h-36","category":"rhythm","task":"'Avval... keyin... nihoyat...' simmetrik matnni tabiiy bog'lovchilar bilan qayta yozing (bosqichlar saqlansin).","A":"Boshlash uchun profilni toʻldirasiz. Soʻng birinchi buyurtmangizni berib koʻrasiz. Hammasi joyiga tushgach, keshbek hisobingizga qoʻshiladi.","B":"Birinchi qadam roʻyxatdan oʻtish, undan keyin profilni toʻldirasiz. Oxirgi qadam esa birinchi buyurtmangiz. Har bosqichda tizim oʻzi keyingi qadamni koʻrsatadi."},{"id":"h3-101","category":"en2uz","task":"Переведите (реклама): «Свежая выпечка каждое утро — попробуйте нашу новинку.»","A":"Har tongda yangi pishirilgan non va pishiriqlar kutadi. Yangi taʼmimizni ham sinab koʻring!","B":"Har ertalab yangi pishirilgan non va pishiriqlar — yangi mahsulotimizni tatib koʻring."},{"id":"h3h-08","category":"switch","task":"Maktab chat guruhi: o'qituvchi rasmiy e'lon (dars jadvali o'zgardi) + ota-onalarning savoli + o'qituvchi javobi. Uch bosqich chat ohangida, rasmiy qism rasmiy.","A":"Assalomu alaykum, hurmatli ota-onalar. Ertaga, 27-oktabr kuni dars jadvali oʻzgaradi: darslar soat 9:00 da boshlanadi. Iltimos, hisobga oling.\n\nOta-ona: Salom ustoz, oxirgi dars ham suriladimi?\n\nOʻqituvchi: Ha, hammasi bir soatga suriladi. Oxirgi dars 14:00 da tugaydi, iltimos, oʻz vaqtida olib keling.","B":"Ota-onalarga eʼlon: payshanba kuni dars jadvalidagi oʻzgarish kuchga kiradi. Birinchi dars 8:30 da boshlanadi, barcha oʻquvchilar uchun majburiy.\n\n— Farzandim ertaroq yetib borishi mumkin boʻladi, desam xato qilmayman. Darsliklarni ham yangi vaqtga moslab olib boramizmi?\n\n— Ha, darsliklarni yangi jadval boʻyicha olib boringlar. Yana aniq savol boʻlsa, shu chatga yozing."},{"id":"h3-102","category":"en2uz","task":"Translate: 'Your table is booked for 19:00 under the name Aziz.'","A":"Stolingiz 19:00 uchun Aziz nomiga band qilindi.","B":"Stolingiz 19:00 uchun Aziz nomiga band qilindi."},{"id":"h3-004","category":"chat","task":"Telegram group: someone asks who's coming to the Saturday football match. Write the organizer's count check message, casual.","A":"Shanba kuni futbolga kim qatnaydi? Yozib qoldiringlar, sanab qoʻyaman","B":"Shanba kungi oʻyinga kim-kim boradi? Kelaman deganlar yozib qoʻysin — sonini sanab qoʻyaman."},{"id":"h3-113","category":"ru2uz","task":"Переведите смысл: «Не всё то золото, что блестит.» (про скидки в интернете)","A":"Har yaltiragan oltin emas: internetdagi har chegirma ham tashqaridan koʻringanidek foydali boʻlmaydi.","B":"Har yaltiragani oltin emas — internetdagi har chegirma ham haqiqiy boʻlmaydi."},{"id":"h3-022","category":"chat","task":"Write the babysitter's morning message: arrived, kid had breakfast, playing. Warm, short.","A":"Keldim, bolacha nonushta qilib oldi\nKayfiyati yaxshi, hozir oʻynab yotibdi","B":"Assalomu alaykum, keldim. Chaqaloq nonushtani ham yedi, hozir oʻynayapti — hammasi joyida."},{"id":"h3-110","category":"ru2uz","task":"Переведите (заявление): «Прошу выдать справку с места работы для визы.»","A":"Viza rasmiylashtirish uchun ish joyimdan maʼlumotnoma berishingizni soʻrayman.","B":"Ish joyimdan viza rasmiylashtirish uchun maʼlumotnoma berilishini soʻrayman."},{"id":"h3-079","category":"mkt","task":"Ad for a driving school intensive course: license in 30 days, 3 lessons a week. 2 lines.","A":"30 kunda haydovchilik guvohnomasi, intensiv kurs\nHaftada 3 marta amaliy mashgʻulot, roʻyxatdan oʻting","B":"30 kunda haydovchilik guvohnomasi — haftasiga 3 marta mashgʻulot.\nIntensiv kursda roʻyxatdan oʻting."},{"id":"h3-088","category":"en2uz","task":"Translate a gym rule: 'Towels are mandatory in the sauna.'","A":"Saunada sochiq boʻlishi shart.","B":"Saunada sochiq boʻlishi shart."},{"id":"h3-105","category":"en2uz","task":"Translate a friendly line: 'It's colder than it looks — take the jacket.'","A":"Havo koʻringanidan sovuq ekan, kurtkangni olib ket.","B":"Tashqarida koʻringanidan sovuqroq — kurtkani olib boring."},{"id":"h3-046","category":"ui","task":"Localize: 'Your card will expire next month', 'Update card', 'Not now'.","A":"Kartangiz muddati keyingi oy tugaydi\nKartani yangilash\nHozir emas","B":"Kartangiz amal qilish muddati keyingi oyda tugaydi\nKartani yangilash\nHozir emas"},{"id":"h3h-07","category":"switch","task":"Bank SMS: rasmiy ogohlantirish qismi + pastda oddiy tilda 'nima qilish kk' izohi bitta xabarda, qatlamlar aralashmasin.","A":"OGOHLANTIRISH. Kartangizdan shubhali operatsiya aniqlandi. Xavfsizlik maqsadida karta vaqtincha bloklandi.\n\nNima qilish kerak: operatsiya sizniki boʻlmasa, bankning rasmiy telefon raqamiga qoʻngʻiroq qiling. Kod va parolingizni hech kimga bermang.","B":"Bank: kartangizda shubhali operatsiya aniqlandi. Bu operatsiyani siz bajarmagan boʻlsangiz, kartani darhol bloklang va bankning rasmiy raqamiga qoʻngʻiroq qiling. OTP-kodni hech kimga bermang.\n\nOddiy tilida: kartangizdan siz bilmagan pul yechilgan boʻlsa, avval kartani bloklang. Bank xodimi sizdan hech qachon kod soʻramaydi — soʻrasa, bu firibgar ekan."},{"id":"h3-016","category":"chat","task":"Customer: 'kafolat muddati tugagami?' — reply: warranty runs 12 months from purchase, receipt needed. Chat register.","A":"Kafolat xariddan keyin 12 oy amal qiladi. Chek qoʻlida boʻlsa, tekshirib beramiz","B":"Kafolat xarid qilingan kundan 12 oy amal qiladi. Chekni yuborsangiz, tekshirib aniq aytaman."},{"id":"h3h-53","category":"native","task":"Odam yozgan tavsiya: 'bu ilovani o'rang, pul saqlashni o'rgatadi, men 3 oyda 2 mln saqladim' — imlo tuzatish tashqari tegilmang.","A":"bu ilovani oʻrang, pul saqlashni oʻrgatadi, men 3 oyda 2 mln saqladim","B":"Bu ilovani oʻrang, pul saqlashni oʻrgatadi. Men 3 oyda 2 mln saqladim."},{"id":"h3-084","category":"en2uz","task":"Translate a recipe step: 'Fry the onions until golden, about 7 minutes.'","A":"Piyozni tillarang boʻlguncha qovuring, taxminan 7 daqiqa.","B":"Piyozni oltin rang olguncha qovuring — taxminan 7 daqiqa."},{"id":"h3-054","category":"ui","task":"Localize for a delivery app: 'Leave at door', 'Meet at door', 'Add delivery note'.","A":"Eshik oldiga qoldirish\nEshik oldida uchrashish\nYetkazish izohini qoʻshish","B":"Eshik oldiga qoldirish\nEshikda uchratish\nYetkazish izohi qoʻshish"},{"id":"h3-020","category":"chat","task":"Support: user's promo code shows invalid. Reply: codes work on orders above 100k, suggest adding an item. Chat register.","A":"Promokod 100 mingdan yuqori buyurtmalarda ishlaydi. Savatga biror narsa qoʻshib koʻring, kod oʻtib ketadi","B":"Promokod 100 000 soʻmdan yuqori buyurtmalarda ishlaydi. Savatga yana bir narsa qoʻshsangiz, kod qabul qiladi."},{"id":"h3-034","category":"ui","task":"Localize: 'Step 2 of 4', 'Next', 'Back', 'Almost done!'.","A":"4 tadan 2-bosqich\nKeyingisi\nOrtga\nDeyarli tayyor!","B":"4 tadan 2-qadam\nKeyingi\nOrtga\nDeyarli tayyor!"},{"id":"h3h-59","category":"dash","task":"Rasmiy xat chiziqlar bilan to'ldirilgan: 'Buyurtma — qabul qilindi. Muddat — 5 kun. Narx — 150 ming. Kafolat — bor.' — rasmiy ohangda chiziqsiz.","A":"Buyurtma qabul qilindi. Muddat 5 kun. Narx 150 ming soʻm. Kafolat bor.","B":"Buyurtmangiz qabul qilindi. Bajarish muddati 5 ish kuni qilib belgilandi. Narxi 150 ming soʻm. Kafolat mavjud."},{"id":"h3h-49","category":"native","task":"Haqiqiy mijoz izohi: 'ilova oson ishlayapti, hattoki otam ham tushundi, rahmat!' — imlo tekshiruvidan boshqa tegilmasin.","A":"ilova oson ishlayapti, hattoki otam ham tushundi, rahmat!","B":"Ilova oson ishlayapti, hatto otam ham tushundi, rahmat!"},{"id":"h3-142","category":"news","task":"Report: grape harvest in Samarkand region up 9%, exports to two new countries.","A":"Samarqand viloyatida uzum hosili oʻtgan yilga nisbatan 9 foizga oshdi. Viloyatda yetishtirilgan uzum ikki yangi davlatga eksport qilina boshlandi.","B":"Samarqand viloyatida bu yil jami 120 ming tonna uzum terildi, bu oʻtgan yilga nisbatan 9 foizga koʻp. Viloyat mahsuloti ikki yangi davlatga ham eksport qilina boshlagan. Batafsil maʼlumotni viloyat hokimligi axborot xizmati berdi."},{"id":"h3-019","category":"chat","task":"Friend: 'shu telefonni olamanmi yoki kutamanmi?' — new model rumored next month. Honest one-line advice.","A":"Men boʻlsam kutardim: oʻtgan oy yangi model chiqadi deb gapirishyapti, shu narxi ham tushadi","B":"Men oʻrnida boʻlsam kutardim — yangi model keyingi oyda chiqadi degan gaplar bor, bu ham arzonlashadi."},{"id":"h3-032","category":"ui","task":"Bank app block dialog: suspicious login detected, confirm it was you or change password. Title + 2 buttons.","A":"Shubhali kirish aniqlandi\nBu men edim\nParolni oʻzgartirish","B":"Shubhali kirish aniqlandi\nBu men edim\nParolni oʻzgartirish"},{"id":"h3-014","category":"chat","task":"Gym partner cancels tonight: 'kechirim bugun bormayman ishdan chirolmadim'. Accept graciously, propose tomorrow. Chat register.","A":"Mayli boʻladi, ish asosiy. Ertaga 19:00 da boʻlamizmi?","B":"Hech qisi yoʻq, ish muhim-ku. Ertaga birga boramizmi?"},{"id":"h3h-35","category":"rhythm","task":"Chat javoblari bir xil uzunlikda — notekis chatga o'tkazing (savol bilan tugagan javob ham bo'lsin).","A":"Keldim, kutaman.\nBoʻldi, yubordim.\nHa, oʻsha kun boʻladi, soat 6 chogʻida chiqaman. Sen boʻshmisan?","B":"Hop, hozir qarayman.\n\nBor, soat 6da olib boraman. Mos keladimi?\n\nBugun boʻlmaydi-ku. Ertaga boʻlsami?"},{"id":"h3-050","category":"ui","task":"Localize for a language app: 'Streak: 12 days', 'Practice now', 'Don't break the chain!'.","A":"Ketma-ketlik: 12 kun\nHozir mashq qilish\nKetma-ketlikni uzatmang!","B":"Ketma-ket kunlar: 12\nHozir mashq qilish\nZanjir uzilmasin!"},{"id":"h3h-29","category":"flavor","task":"Ertak ohangi 3 gap: ayiq va asal haqida, oxirida xalq hikmati ohangi (mavjud birlik).","A":"Ayiq asalning shirinligini eshitib, ari uyasini buzib kiribdi. Biroq asal bilan birga arilar ham uygʻonibdi. Xalqimiz aytgandek, har narsaning oʻz choʻyi bor.","B":"Ayiq daraxt ostida kutib turladi, asal teshigiga yetib boʻlmaydi. Bir necha bor urinadi, oxir-oqibat yogʻochdan asal tomchilari siza boshlaydi. Shunda tushunasiz: «Sabr tagi — oltin» degani bejiz emas."},{"id":"h3h-51","category":"native","task":"Mahalla e'loni tabiiy: 'ertaga hashar, kim kela olmasa uzri bo'lsin, non-choy hammasa bor' — imlo tekshiruvi tashqari tegmang.","A":"ertaga hashar, kim kela olmasa uzri boʻlsin, non-choy hammasi bor","B":"Ertaga hashar. Kim kela olmasa, uzri boʻlsin. Non-choy hammasi bor."},{"id":"h3-119","category":"ru2uz","task":"Переведите (расписание): «Приём документов: понедельник–пятница, с 9 до 18.»","A":"Hujjatlar qabuli: dushanbadan jumagacha, soat 9:00 dan 18:00 gacha.","B":"Hujjatlar qabuli: dushanbadan jumagacha, soat 9:00 dan 18:00 gacha."},{"id":"h3-058","category":"mkt","task":"Ad for evening accounting courses: from zero to junior accountant in 6 months. 2 lines + CTA.","A":"Kechki buxgalteriya kurslari: noldan junior buxgaltergacha 6 oyda\nHar kechqurun 2 soat, amaliy topshiriqlar bilan\nRoʻyxatdan oʻting.","B":"Noldan boshlab 6 oyda junior hisobchi boʻling.\nDarslar kechqurun — ishdan keyin oʻqiysiz.\nRoʻyxatdan oʻting."},{"id":"h3-135","category":"formal","task":"Ta'lim bo'limiga murojaat: maktab yotoqxonasida ta'mir ishlari bajarilishi haqida.","A":"Kimga: Bekobod tumani xalq taʼlimi boʻlimi mudiriga\nKimdan: 3-sonli kasb-hunar maktabi 2-kurs talabasi Ilhomova Nigora Rustamovna, tel: +998 94 555-00-77\n\nMURAOJAT\n\nMaktab yotoqxonasining 2-qavatida tom yomgʻir oʻtkazmoqda, xonalarda namlik kuchaygan, devorlar qarigan. Bu qavatda qirq nafarga yaqin talaba yashaydi. Qish kirishidan oldin yotoqxona tomiga va xonalarga taʼmir ishlari oʻtkazilishini iltimos qilaman. Yozma javobingizni kutaman.\n\nHurmat bilan,\nIlhomova Nigora Rustamovna\n2026-yil 24-oktabr","B":"Murojaat\n\nXalq taʼlimi boʻlimiga\n\nMaktab yotoqxonasining tom qismi va derazalar eskirgan, qish oylarida xonalar sovuq boʻlib qolmoqda. Yotoqxonda taʼmir ishlari oʻtkazilishini soʻraymiz. Bu farzandlarimizning sogʻligʻi va oʻqish sharoiti uchun muhim ahamiyatga ega.\n\nHurmat bilan, [F.I.Sh.]"},{"id":"h3-008","category":"chat","task":"Telegram channel post: app update 2.1 is live, fixes crashes on older phones, 2 short lines.","A":"Ilovaning 2.1 versiyasi chiqdi, eski telefonlarda yopilib qolish muammosini tuzatdik\nBatafsil 👇👇👇","B":"Yangi 2.1-versiya chiqdi ✅ Eski telefonlarda ilova qotib qolishi hal qilindi.\nBatafsil 👇👇👇"},{"id":"h3-074","category":"mkt","task":"Two test headlines for a grocery delivery app: 15-minute delivery, no minimum order.","A":"Oziq-ovqat 15 daqiqada eshigingizda\nMinimal summa yoʻq. Bir non ham keltiramiz, 15 daqiqada.","B":"Xaridingiz 15 daqiqada eshikda.\nMinimal buyurtma yoʻq — bir non ham yetkazamiz."},{"id":"h3-068","category":"mkt","task":"Launch post for a local granola brand: baked in Chirchiq, 4 flavors, ships nationwide. 2 lines.","A":"Chirchiqdagi ustaxonamizda granola pishiramiz, 4 xil taʼmi bor\nRespublika boʻylab yetkazib beramiz, nonushtangizga buyurtma bering","B":"Granolamiz endi Chirchiqda pishadi — 4 xil taʼm bilan chiqdi.\nOʻzbekiston boʻylab yetkazib beramiz."},{"id":"h3-137","category":"formal","task":"Mahalladan ma'lumotnoma so'rov: oila tarkibi haqida, uy-joy jamg'armasi uchun.","A":"Kimga: Chilonzor tumani «Doʻstlik» mahalla fuqarolar yigʻini raisiga\nKimdan: 17-uy, 5-xonadon fuqarosi Mirzayev Akbar Sobirovich, tel: +998 91 654-32-10\n\nARIZA\n\nMen, Mirzayev Akbar Sobirovich, quyidagicha: uy-joy jamgʻarmasiga aʻzo boʻlish uchun bankka oila tarkibi toʻgʻrisidagi maʼlumotnoma kerak. Oila toʻrta kishidan iborat: men, xotinim va ikki farzandim. Maʼlumotnomani 2026-yil 30-oktabrga qadar berishingizni soʻrayman, shu sanadan keyin bank hujjatni qabul qilmaydi.\n\nHurmat bilan,\nMirzayev Akbar Sobirovich\n2026-yil 24-oktabr","B":"Ariza\n\nMahalla fuqarolar yigʻini raisiga\n\nUy-joy jamgʻarmasi hujjatlarini rasmiylashtirish uchun oilam tarkibi haqida maʼlumotnoma talab etilmoqda. Shu bois oilam tarkibi boʻyicha maʼlumotnoma berishni soʻrayman.\n\nHurmat bilan, [F.I.Sh.]"},{"id":"h3-114","category":"ru2uz","task":"Переведите (инструкция): «Дважды нажмите кнопку, чтобы сбросить настройки.»","A":"Sozlamalarni tiklash uchun tugmani ikki marta bosing.","B":"Sozlamalarni tiklash uchun tugmani ikki marta bosing."},{"id":"h3-066","category":"mkt","task":"Banner for a laptop sale: student discount 15% with a student ID. One line + CTA.","A":"Talabalar guvohnomasi bilan noutbuklarga 15% chegirma\nTanlab koʻring","B":"Talaba guvohnomasi bilan 15% chegirma.\nLaptopni hozir tanlang."},{"id":"h3-052","category":"ui","task":"Localize: 'Turn on notifications', 'You'll miss order updates otherwise', 'Enable'.","A":"Bildirishnomalarni yoqing\nAks holda buyurtma yangilanishlarini oʻtkazib yuborasiz\nYoqish","B":"Bildirishnomalarni yoqing\nAks holda buyurtma haqidagi yangilanishlarni oʻtkazib yuborasiz\nYoqish"},{"id":"h3-048","category":"ui","task":"Localize a kids' app gate: grown-ups only, enter your birth year to continue. 2 lines.","A":"Bu boʻlim faqat kattalar uchun\nDavom etish uchun tugʻilgan yilingizni kiriting","B":"Bu boʻlim faqat kattalar uchun.\nDavom etish uchun tugʻilgan yilingizni kiriting."}];
const KEY = {"h3h-36":{"A":"v2","B":"v1"},"h3-101":{"A":"v2","B":"v1"},"h3h-08":{"A":"v2","B":"v1"},"h3-102":{"A":"v2","B":"v1"},"h3-004":{"A":"v2","B":"v1"},"h3-113":{"A":"v2","B":"v1"},"h3-022":{"A":"v2","B":"v1"},"h3-110":{"A":"v2","B":"v1"},"h3-079":{"A":"v2","B":"v1"},"h3-088":{"A":"v2","B":"v1"},"h3-105":{"A":"v2","B":"v1"},"h3-046":{"A":"v2","B":"v1"},"h3h-07":{"A":"v2","B":"v1"},"h3-016":{"A":"v2","B":"v1"},"h3h-53":{"A":"v2","B":"v1"},"h3-084":{"A":"v2","B":"v1"},"h3-054":{"A":"v2","B":"v1"},"h3-020":{"A":"v2","B":"v1"},"h3-034":{"A":"v2","B":"v1"},"h3h-59":{"A":"v2","B":"v1"},"h3h-49":{"A":"v2","B":"v1"},"h3-142":{"A":"v1","B":"v2"},"h3-019":{"A":"v2","B":"v1"},"h3-032":{"A":"v2","B":"v1"},"h3-014":{"A":"v2","B":"v1"},"h3h-35":{"A":"v2","B":"v1"},"h3-050":{"A":"v2","B":"v1"},"h3h-29":{"A":"v2","B":"v1"},"h3h-51":{"A":"v2","B":"v1"},"h3-119":{"A":"v2","B":"v1"},"h3-058":{"A":"v2","B":"v1"},"h3-135":{"A":"v2","B":"v1"},"h3-008":{"A":"v2","B":"v1"},"h3-074":{"A":"v2","B":"v1"},"h3-068":{"A":"v2","B":"v1"},"h3-137":{"A":"v2","B":"v1"},"h3-114":{"A":"v2","B":"v1"},"h3-066":{"A":"v2","B":"v1"},"h3-052":{"A":"v2","B":"v1"},"h3-048":{"A":"v2","B":"v1"}};
const answers = {};
const quiz = document.getElementById("quiz");
ITEMS.forEach((it, i) => {
  const d = document.createElement("div"); d.className = "card";
  d.innerHTML = `<div class="task">${i+1}. [${it.category}] ${it.task.replace(/</g,"&lt;")}</div>
    <div class="out"><b>A.</b> ${it.A.replace(/</g,"&lt;")}</div>
    <div class="out"><b>B.</b> ${it.B.replace(/</g,"&lt;")}</div>
    <label><input type="radio" name="${it.id}" value="A" onchange="ans('${it.id}','A')"> A yaxshiroq</label>
    <label><input type="radio" name="${it.id}" value="B" onchange="ans('${it.id}','B')"> B yaxshiroq</label>
    <label><input type="radio" name="${it.id}" value="tie" onchange="ans('${it.id}','tie')"> Barobar</label>`;
  quiz.appendChild(d);
});
function ans(id, v){ answers[id] = v; }
function finish(){
  const res = {v2:0, v1:0, tie:0, unanswered:0};
  let rows = "";
  for (const it of ITEMS){
    const a = answers[it.id];
    if (!a){ res.unanswered++; continue; }
    const winner = a === "tie" ? "tie" : KEY[it.id][a];
    res[winner]++;
    rows += `<div>${it.id}: tanlov ${a} → <span class="tag">${winner}</span></div>`;
  }
  const r = document.getElementById("result");
  r.style.display = "block";
  r.innerHTML = `<h2>Natija (unblinded)</h2>
   <p>v2 (uzbekify): <b>${res.v2}</b> · v1: <b>${res.v1}</b> · barobar: ${res.tie} · javob berilmagan: ${res.unanswered}</p>${rows}`;
  r.scrollIntoView();
}
</script></body></html>
