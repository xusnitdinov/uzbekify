am group: organizing a farewell party for a moving teammate. Write the coordinator's message asking for contributions, casual.","A":"Dostlar, jamoadoshimiz yaqinda boshqa shaharga koʻchadi, vidolashuv kechasini oʻtkazamiz.\nKim hissa qoʻshadi, pul ham boʻladi, gʻoyalar ham? Shu guruhga yozinglar.","B":"Dostlar, jamoadoshimiz shu hafta shahardan koʻchib ketmoqda — shanba kuni kichkina xayrlashuv qilamiz. Kim xohlasa hissa qoʻshsin: pul yigʻaman, tort-ichimlik olib kelganlar ham boʻladi. Qoʻshilaman desangiz, shu yerga yozing."},{"id":"h4-113","category":"ru2uz","task":"Переведите смысл: «Дареному коню в зубы не смотрят.» (про подарок другу)","A":"Doʻst bergan sovgʻani shunchaki qadrlash kerak, uning kamchiligini qidirmaymiz.","B":"Doʻst bergan sovgʻani sormaydilar — u oz boʻlsa ham yurakdan qilingan."},{"id":"h4-022","category":"chat","task":"Write the sitter's text: kids fed, homework done, playground until 18:00. Warm, 2 lines.","A":"Assalomu alaykum, xotirjam boʻling! Bolalar ovqatlandi, uy vazifalarini ham qilib boʻldik.\nHozir maydonchada oʻynab yuribmiz, soat 18:00 gacha.","B":"Salom! Bolalarni toʻyimli ovqatlantirdim, uyga berilgan vazifalarni ham bitirib boʻldilar. 18:00 gacha maydonchada oʻynab chiqdik — hammasi joyida!"},{"id":"h4-110","category":"ru2uz","task":"Переведите (заявление): «Прошу зарегистрировать моего ребенка по адресу проживания.»","A":"Toshkent shahar Yunusobod tumani hokimligiga\n\nKarimov Sardor Bahodirovich\nToshkent shahri, Yunusobod tumani, Bobur koʻchasi, 45-uy, 12-xonadon\ntel: +998 90 123-45-67\n\nARIZA\n\nFarzandim Karimov Muhammadyusuf 2026-yilning 12-sentyabrida tugʻilgan. Hozirgacha u hech qanday manzil boʻyicha roʻyxatga olinmagan. Arizam quyidagicha: farzandim uchun biz yashaydigan manzilimiz boʻyicha roʻyxatga olishni soʻrayman. Talab etilgan qoʻshimcha hujjatlar boʻlsa, darhol taqdim etaman. Soʻrovimni koʻrib chiqishingizni soʻrayman.\n\nHurmat bilan,\nKarimov Sardor\n2026-yil 21-oktabr","B":"Farzandimni yashash manzilim boʻy const answers = {};
const quiz = document.getElementById("quiz");
ITEMS.forEach((it, i) => {
  const d = document.createElement("div"); d.className = "card";
  d.innerHTML = `<div class="task">${i+1}. [${it.category}] ${it.task.replace(/</g,"&lt;")}</div>
    <div class="out"><b>A.</b> ${it.A.replace(/</g,"&lt;")}</div>
    <div class="out"><b>B.</b> ${it.B.replace(/</g,"&lt;")}</div>
    <label><input type="radio" name="${it.id}" value="A" onchange="ans('${it.id}','A')"> A yaxshiroq</label>
    <label><input type="radio" name="${it.id}" value="B" onchange="ans('${it.id}','B')"> B yaxshiroq</label>
    <label><input type="radio" name="${it.id}" value="tie" onchange="ans('${it.id}','tie')"> Barobar</label>`;
  quiz.appendChild(d);
});
function ans(id, v){ answers[id] = v; }
function finish(){
  const res = {v2:0, v1:0, tie:0, unanswered:0};
  let rows = "";
  for (const it of ITEMS){
    const a = answers[it.id];
    if (!a){ res.unanswered++; continue; }
    const winner = a === "tie" ? "tie" : KEY[it.id][a];
    res[winner]++;
    rows += `<div>${it.id}: tanlov ${a} → <span class="tag">${winner}</span></div>`;
  }
  const r = document.getElementById("result");
  r.style.display = "block";
  r.innerHTML = `<h2>Natija (unblinded)</h2>
   <p>v2 (uzbekify): <b>${res.v2}</b> · v1: <b>${res.v1}</b> · barobar: ${res.tie} · javob berilmagan: ${res.unanswered}</p>${rows}`;
  r.scrollIntoView();
}
</script></body></html>
